<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#227C70"/>
      <stop offset="100%" stop-color="#145A51"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF6F63"/>
      <stop offset="100%" stop-color="#DF6357"/>
    </linearGradient>
    <linearGradient id="pageGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2EFE9"/>
    </linearGradient>
    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#E7E2D8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Vibrant Brand Background Squircle (fills 87.5% of viewBox for maximum scale clarity) -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#tealGrad)"/>

  <g filter="url(#softGlow)">
    <!-- Book Left Page -->
    <path d="M15 19 C15 17.5 16.5 16 18 16 L31 18 C31.8 18.1 32 18.8 32 19.5 L32 46 C32 46.8 31.5 47.3 30.5 47 L18 45 C16.5 44.8 15 43.5 15 42 Z" fill="url(#pageGradLeft)" />

    <!-- Book Right Page -->
    <path d="M49 19 C49 17.5 47.5 16 46 16 L33 18 C32.2 18.1 32 18.8 32 19.5 L32 46 C32 46.8 32.5 47.3 33.5 47 L46 45 C47.5 44.8 49 43.5 49 42 Z" fill="url(#pageGradRight)" />

    <!-- Spine Center Shadow -->
    <line x1="32" y1="18.5" x2="32" y2="46.5" stroke="#145A51" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Page Text Accent Lines (Bold for 16px crisp rendering) -->
    <line x1="19" y1="24" x2="27" y2="25" stroke="#227C70" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="19" y1="30" x2="26" y2="31" stroke="#227C70" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <line x1="19" y1="36" x2="24" y2="37" stroke="#227C70" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Signature Coral Bookmark Ribbon -->
    <path d="M38 16.5 L38 31 L41.5 28.5 L45 31 L45 16.5 Z" fill="url(#coralGrad)" />
  </g>
</svg>

